# Build and attach VoxClaw.app to GitHub Releases when a version tag is pushed.
# Usage: git tag v1.0.0 && git push origin v1.0.0
#
# For a Gatekeeper-clean download you need BOTH Developer ID signing AND
# notarization (signing alone is rejected as "Unnotarized Developer ID").
# Signing secrets:
#   MACOS_CERTIFICATE_P12_BASE64  - base64 of your .p12 (base64 -i cert.p12 | pbcopy)
#   MACOS_CERTIFICATE_PASSWORD   - password for the .p12
#   APP_IDENTITY                 - e.g. "Developer ID Application: Your Name (TEAM_ID)"
# Notarization secrets:
#   APPLE_ID                     - Apple ID email for the developer account
#   APPLE_TEAM_ID                - 10-char team id (e.g. X2RKZ5TG99)
#   APPLE_NOTARY_PASSWORD        - app-specific password from appleid.apple.com
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${BUILD_CERTIFICATE_BASE64:-}" ]]; then
            echo "No signing certificate secret configured. Using ad-hoc signing."
            exit 0
          fi
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Patch Package.swift for CI
        run: |
          # CI runner may not have macOS 26 SDK; patch to v15 for build.
          sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.1/' Package.swift
          sed -i '' 's/.macOS(.v26)/.macOS(.v15)/' Package.swift
          sed -i '' 's/.iOS(.v26)/.iOS(.v18)/' Package.swift

      - name: Build & Package
        env:
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
        run: |
          swift build -c release
          ./Scripts/package_app.sh release

      # Notarize so downloads don't hit a Gatekeeper prompt. A Developer ID
      # signature alone is rejected as "Unnotarized Developer ID"; notarization +
      # stapling is what makes it launch cleanly. Skips gracefully if creds absent.
      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [[ -z "${APPLE_NOTARY_PASSWORD:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "Notarization credentials not set; skipping (build will be unnotarized)."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent VoxClaw.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple VoxClaw.app
          xcrun stapler validate VoxClaw.app
          rm -f notarize.zip

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent VoxClaw.app VoxClaw.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VoxClaw.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # EdDSA-sign the released zip and publish a Sparkle appcast entry on main so
      # existing installs can auto-update. Skips if the signing key isn't set.
      - name: Sign update + publish appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "SPARKLE_PRIVATE_KEY not set; skipping appcast publish."
            exit 0
          fi
          SIGN="$(find .build/artifacts -type f -name sign_update | head -1)"
          OUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN" --ed-key-file - VoxClaw.zip)"
          SIG="$(printf '%s' "$OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(printf '%s' "$OUT" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')"
          source version.env
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/VoxClaw.zip"
          # The CI build patched Package.swift in-tree; discard it before switching branches.
          git checkout -- Package.swift 2>/dev/null || true
          git fetch --depth=1 origin main
          git checkout main
          ./Scripts/update_appcast.sh docs/appcast.xml "$MARKETING_VERSION" "$BUILD_NUMBER" "$URL" "$SIG" "$LEN"
          if ! git diff --quiet docs/appcast.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/appcast.xml
            git commit -m "appcast: VoxClaw ${MARKETING_VERSION} (build ${BUILD_NUMBER}) [skip ci]"
            git push origin main
          fi
